[project]
name = "python-uv-template"
version = "0.1.0"
description = "This is a python template using uv"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "poethepoet>=0.38.0",
    "pre-commit>=4.5.0",
    "ruff>=0.14.7",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Lintルールをどこまで有効にするか
select = [
  "E",  # pycodestyle エラー
  "W",  # pycodestyle 警告
  "F",  # pyflakes
  "I",  # import順序
  "N",  # pep8-naming
  "UP", # pyupgrade
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
]

# 無効化したいルール
ignore = [
  "E501", # 行が長い (代わりにformatterで調整)
]

# 無視したいディレクトリ
exclude = [".git", "__pycache__", ".venv", ".mypy_cache", ".ruff_cache"]

[tool.ruff.format]
# Black互換のフォーマッタを使う
quote-style = "double"       # ダブルクォートに統一
indent-style = "space"       # スペースインデント
line-ending = "lf"           # 改行コード
docstring-code-format = true # docstring中のコードも整形

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

exclude = [".git", "__pycache__", ".venv", ".mypy_cache", ".ruff_cache"]

[tool.poe.tasks]
format = "uv run ruff format ."
lint = "uv run ruff check --fix ."
type-check = "uv run mypy ."

check = ["format", "lint", "type-check"]
